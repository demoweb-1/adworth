addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||M.rm)return;const b=e.target.closest&&e.target.closest('.btn');if(!b||b.classList.contains('sm'))return;const r=b.getBoundingClientRect();b.style.setProperty('--mx',(e.clientX-r.left-r.width/2)*.18+'px');b.style.setProperty('--my',(e.clientY-r.top-r.height/2)*.28+'px')},{passive:true});

fetch('settings.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(c=>{try{if(!c||localStorage.getItem(KEY))return}catch(e){}S={...S,...c};render()}).catch(()=>{});
addEventListener('hashchange',render);render();
</script>
